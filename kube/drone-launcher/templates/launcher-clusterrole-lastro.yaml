{{- if .Values.drone_launcher.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.drone_launcher.name }}-lastro-clusterrole
  labels:
    {{- include "drone_launcher.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - list
      - get
      - create
      - update
      - delete

  - apiGroups:
      - ""
    resources:
      - serviceaccounts
      - services
    verbs:
      - get
      - create
      - patch
      - delete

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
      - get

  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - list
      - get
      - create
      - patch

  - apiGroups:
      - "apps"
    resources:
      - deployments
    verbs:
      - get
      - create
      - patch
      - delete

  - apiGroups:
      - "batch"
    resources:
      - jobs
    verbs:
      - list
      - get
      - create
      - patch
      - delete

  - apiGroups:
      - "networking.k8s.io"
    resources:
      - ingresses
    verbs:
      - get
      - create
      - patch
      - delete
{{- end }}
