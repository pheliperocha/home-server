{{- if .Values.clusterReadonly.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.clusterReadonly.name }}-view
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterReadonly.name }}
    namespace: {{ .Values.clusterReadonly.namespace }}
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.clusterReadonly.name }}-audit
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterReadonly.name }}
    namespace: {{ .Values.clusterReadonly.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.clusterReadonly.name }}-audit
  apiGroup: rbac.authorization.k8s.io
{{- end }}
