lastro:
  enabled: true
  name: lastro
  port: 3000
  replicaCount: 1
  image: pheliperocha/home-server:lastro-0.4.1
  ingress:
    enabled: true
    localHostname: lastro.home.pheliperocha.com
  tunnel:
    enabled: false
  publicUrl: https://lastro.home.pheliperocha.com
  migration:
    enabled: true
  databaseSecret: lastro-db-app
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
