{{- if .Values.lastro.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.lastro.name }}-service
  labels:
    {{- include "lastro.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.lastro.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ .Values.lastro.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
