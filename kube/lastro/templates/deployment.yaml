{{- if .Values.lastro.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.lastro.name }}
  labels:
    {{- include "lastro.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.lastro.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  replicas: {{ .Values.lastro.replicaCount }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.lastro.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.lastro.name }}-serviceaccount
      imagePullSecrets:
        - name: docker-registry-credentials
      containers:
      - name: {{ .Values.lastro.name }}
        image: {{ .Values.lastro.image }}
        imagePullPolicy: Always
        ports:
          - name: http
            containerPort: {{ .Values.lastro.port }}
            protocol: TCP
        env:
          - name: PORT
            value: {{ .Values.lastro.port | quote }}
          - name: PUBLIC_URL
            value: {{ .Values.lastro.publicUrl | quote }}
          - name: OWNER_PASSWORD_HASH
            valueFrom:
              secretKeyRef:
                name: {{ .Values.lastro.name }}-secrets
                key: OWNER_PASSWORD_HASH
          {{- include "lastro.databaseEnv" . | nindent 10 }}
        resources:
          {{- toYaml .Values.lastro.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
{{- end }}
