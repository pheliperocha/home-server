{{- if and .Values.lastro.enabled .Values.lastro.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.lastro.name }}-migrate
  labels:
    {{- include "lastro.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.lastro.name }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.lastro.name }}-serviceaccount
      imagePullSecrets:
        - name: docker-registry-credentials
      containers:
        - name: migrate
          image: {{ .Values.lastro.image }}
          imagePullPolicy: Always
          command: ["node", "apps/server/src/db/migrate.ts"]
          env:
            {{- include "lastro.databaseEnv" . | nindent 12 }}
{{- end }}
