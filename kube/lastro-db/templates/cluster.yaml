{{- $v := .Values.lastro_db }}
{{- $clusterName := include "lastro-db.clusterName" . }}
{{- if $v.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $clusterName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lastro-db.labels" . | nindent 4 }}
spec:
  instances: {{ $v.cluster.instances }}

  imageName: ghcr.io/cloudnative-pg/postgresql:18.1

  bootstrap:
    {{- if $v.restore.enabled }}
    # Restore mode: build the cluster from the base backup + WAL in S3.
    # Bootstrap only runs when the cluster is created. See docs/recovery.md.
    recovery:
      source: backup-source
      database: {{ $v.database.name }}
      owner: app
      {{- if $v.restore.targetTime }}
      recoveryTarget:
        targetTime: {{ $v.restore.targetTime | quote }}
      {{- end }}
    {{- else }}
    initdb:
      database: {{ $v.database.name }}
      owner: app
      encoding: UTF8
      localeCType: en_US.UTF-8
      localeCollate: en_US.UTF-8
    {{- end }}

  {{- if $v.restore.enabled }}
  externalClusters:
    - name: backup-source
      barmanObjectStore:
        destinationPath: "s3://{{ $v.backup.s3.bucket }}{{ $v.backup.s3.path }}"
        endpointURL: {{ $v.backup.s3.endpointURL }}
        serverName: {{ $v.restore.sourceServerName | default $v.backup.serverName | default $clusterName }}
        s3Credentials:
          accessKeyId:
            name: {{ $v.backup.s3.credentialsSecretName }}
            key: AWS_ACCESS_KEY_ID
          secretAccessKey:
            name: {{ $v.backup.s3.credentialsSecretName }}
            key: AWS_SECRET_ACCESS_KEY
        wal:
          maxParallel: 4
  {{- end }}

  storage:
    size: {{ $v.cluster.storage.size }}
    {{- if $v.cluster.storage.storageClass }}
    storageClass: {{ $v.cluster.storage.storageClass }}
    {{- end }}

  resources:
    requests:
      memory: {{ $v.cluster.resources.requests.memory | quote }}
      cpu: {{ $v.cluster.resources.requests.cpu | quote }}
    limits:
      memory: {{ $v.cluster.resources.limits.memory | quote }}
      cpu: {{ $v.cluster.resources.limits.cpu | quote }}

  postgresql:
    parameters:
      {{- range $key, $value := $v.cluster.postgresql.parameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}

  monitoring:
    enablePodMonitor: true

  {{- if $v.backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: "s3://{{ $v.backup.s3.bucket }}{{ $v.backup.s3.path }}"
      endpointURL: {{ $v.backup.s3.endpointURL }}
      {{- if $v.backup.serverName }}
      serverName: {{ $v.backup.serverName }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ $v.backup.s3.credentialsSecretName }}
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: {{ $v.backup.s3.credentialsSecretName }}
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
        encryption: AES256
      data:
        compression: gzip
        encryption: AES256
    retentionPolicy: {{ $v.backup.retentionPolicy | quote }}
  {{- end }}
{{- end }}
