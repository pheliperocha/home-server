lastro_db:
  enabled: true

  database:
    name: lastro

  cluster:
    instances: 1

    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

    storage:
      size: 5Gi
      storageClass: ""

    postgresql:
      parameters:
        max_connections: "50"
        shared_buffers: "64MB"
        effective_cache_size: "256MB"
        work_mem: "4MB"

  backup:
    enabled: true
    schedule: "0 0 3 * * *" # Every day at 3am
    retentionPolicy: "30d"
    s3:
      endpointURL: "https://s3.sa-east-1.amazonaws.com"
      bucket: "lastro-backups"
      path: "/cnpg-production"
      credentialsSecretName: "aws-secrets"
    serverName: ""
    manualBackup:
      enabled: false
      suffix: ""

  # Restore mode. When enabled, the cluster is created from the backups in
  # backup.s3 instead of an empty initdb. Only takes effect when the Cluster
  # is created. See docs/recovery.md.
  restore:
    enabled: false
    # Folder to read from. Empty = backup.serverName, then the cluster name.
    sourceServerName: ""
    # Optional point in time, RFC 3339. Empty = latest WAL.
    targetTime: ""

  service:
    name: "pg-lastro-db"
    type: ClusterIP
    port: 5432

  networkPolicy:
    enabled: true
    allowSameNamespace: true
